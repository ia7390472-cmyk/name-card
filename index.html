<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="color-scheme" content="dark">
<title>Андреев Иван — визитка</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0e1117;
    --card:#161b24;
    --line:#232a36;
    --text:#eef2f8;
    --muted:#96a1b4;
    --accent:#4c8dff;
    --accent-2:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%, #1b2436 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 16px 40px;
    min-height:100%;
  }
  main{width:100%;max-width:420px}
  .card{
    background:linear-gradient(180deg,#1a2130 0%, var(--card) 100%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px 20px 20px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    text-align:center;
  }
  .avatar{
    width:92px;height:92px;border-radius:50%;
    margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:700;letter-spacing:.5px;
    color:#fff;
    background:linear-gradient(135deg,#3b82f6,#22c55e);
    box-shadow:0 8px 24px rgba(59,130,246,.35);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
  .role{color:var(--muted);font-size:14px;margin:0 0 20px}
  .actions{display:grid;gap:10px;margin-bottom:18px}
  .btn{
    display:flex;align-items:center;gap:12px;
    text-decoration:none;color:var(--text);
    background:#1f2735;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:16px;font-weight:600;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.985)}
  button.btn{width:100%;font:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
  .btn svg{flex:0 0 22px;width:22px;height:22px;opacity:.9}
  .btn.primary{background:linear-gradient(135deg,#2f6fe4,#4c8dff);border-color:#3b7bf0}
  .btn.primary svg{opacity:1}
  .btn .sub{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.65);margin-top:2px}
  .btn .label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
  .btn.tg{background:#1d2a3a;border-color:#27405c}
  .btn.mail{background:#1c242f}
  .info{
    text-align:left;
    border-top:1px solid var(--line);
    padding-top:16px;
    display:grid;gap:10px;
  }
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:600;text-align:right}
  .hint{margin:16px 2px 0;color:var(--muted);font-size:12px;text-align:center}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:#22c55e;color:#04240f;font-weight:700;font-size:14px;
    padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div class="toast" id="toast">Скопировано</div>
<script>
  const toast = document.getElementById('toast');
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }
  function execCopy(text){
    return new Promise((resolve, reject) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy failed'));
      } catch (err) {
        reject(err);
      }
    });
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(() => execCopy(text));
    }
    return execCopy(text);
  }

  document.querySelectorAll('[data-copy]').forEach(el => {
    el.addEventListener('click', () => {
      const value = el.getAttribute('data-copy');
      copyText(value)
        .then(() => showToast('Номер скопирован: ' + value))
        .catch(() => showToast('Не удалось скопировать'));
    });
  });
</script>
